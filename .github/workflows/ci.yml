name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Derive short SHA
        run: echo "GIT_HASH=${GITHUB_SHA:0:7}" >> $GITHUB_ENV
      - name: Build check
        run: uv run mkdocs build
      - name: Format check
        run: uv run ruff format --check . --exclude 'docs/research/external'

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: [lint]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Derive short SHA
        run: echo "GIT_HASH=${GITHUB_SHA:0:7}" >> $GITHUB_ENV
      - name: Build and deploy
        run: uv run mkdocs gh-deploy --force
