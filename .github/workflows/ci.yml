name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen  # API/test deps in [project.dependencies]; fails if uv.lock is stale
      - name: Derive short SHA
        run: echo "GIT_HASH=${GITHUB_SHA:0:7}" >> $GITHUB_ENV
      - name: Test
        run: uv run pytest -q
      - name: Build check
        run: uv run mkdocs build
      - name: Lint & Format check
        run: |
          uv run poe lint-py
          uv run poe check-fmt

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: [lint]
    # Serialize Pages deployments: deploy-pages is async and parallel runs
    # can land out of order, making GitHub Pages serve an older artifact
    # ("fallback to a historical version"). Cancel stale in-progress deploys.
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Derive short SHA
        run: echo "GIT_HASH=${GITHUB_SHA:0:7}" >> $GITHUB_ENV
      - name: Build site
        run: uv run mkdocs build
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
