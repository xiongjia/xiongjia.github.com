{% if config.extra.comments.enabled and page.meta.comments %}
<div id="giscus-container"></div>
<script>
  (function() {
    'use strict';

    var REPO      = "{{ config.extra.comments.repo | e }}";
    var REPO_ID   = "{{ config.extra.comments.repo_id | e }}";
    var CATEGORY  = "{{ config.extra.comments.category | e }}";
    var CAT_ID    = "{{ config.extra.comments.category_id | e }}";
    var MAPPING   = "{{ config.extra.comments.mapping | e }}";
    var LANG      = "{{ config.extra.comments.lang | e }}";
    var LIGHT     = "{{ config.extra.comments.light_theme | e }}";
    var DARK      = "{{ config.extra.comments.dark_theme | e }}";

    function currentTheme() {
      var scheme = document.body.getAttribute('data-md-color-scheme');
      return scheme === 'slate' ? DARK : LIGHT;
    }

    function loadGiscus() {
      var el = document.getElementById('giscus-container');
      if (!el) return;
      // Remove old content (iframe + script left from previous toggle)
      el.innerHTML = '';
      var s = document.createElement('script');
      s.src = 'https://giscus.app/client.js';
      s.setAttribute('data-repo', REPO);
      s.setAttribute('data-repo-id', REPO_ID);
      s.setAttribute('data-category', CATEGORY);
      s.setAttribute('data-category-id', CAT_ID);
      s.setAttribute('data-mapping', MAPPING);
      s.setAttribute('data-strict', '0');
      s.setAttribute('data-reactions-enabled', '1');
      s.setAttribute('data-emit-metadata', '0');
      s.setAttribute('data-input-position', 'bottom');
      s.setAttribute('data-theme', currentTheme());
      s.setAttribute('data-lang', LANG);
      s.setAttribute('crossorigin', 'anonymous');
      s.async = true;
      el.appendChild(s);
    }

    // Initial load
    loadGiscus();

    // Theme sync — observe data-md-color-scheme changes
    // Destroys the old Giscus iframe and re-creates with the correct theme
    var observer = new MutationObserver(function() {
      var el = document.getElementById('giscus-container');
      if (el) {
        // Brief debounce: if multiple attributes change at once, only rebuild once
        clearTimeout(el._themeTimer);
        el._themeTimer = setTimeout(loadGiscus, 100);
      }
    });
    observer.observe(document.body, {
      attributes: true,
      attributeFilter: ['data-md-color-scheme']
    });
  })();
</script>
{% endif %}
