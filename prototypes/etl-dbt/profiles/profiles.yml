# Local DuckDB profile: seeds and models both write to data/analytics.duckdb.
# Run with: DBT_PROFILES_DIR=profiles uv run dbt <command>
# path is relative to the cwd where dbt runs (project root).
etl_dbt:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "data/analytics.duckdb"
      schema: main
      threads: 4