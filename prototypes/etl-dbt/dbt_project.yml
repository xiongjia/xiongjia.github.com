name: etl_dbt
version: 1.0.0
config-version: 2

# Must match the profile name in profiles/profiles.yml
profile: etl_dbt

model-paths: ["models"]
test-paths: ["tests"]

target-path: "target"
log-path: "logs"

clean-targets:
  - "target"
  - "logs"

models:
  etl_dbt:
    staging:
      # Light cleaning/typing only; keep as views (no landing)
      +materialized: view
    marts:
      # Target analytical tables are materialized
      +materialized: table
      daily_sales:
        # Incremental model: only processes new partitions per run
        +materialized: incremental
        +incremental_strategy: delete+insert
        +unique_key: order_date
        +on_schema_change: sync_all_columns