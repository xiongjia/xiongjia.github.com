name: etl_dbt
version: 1.0.0
config-version: 2

# Must match the profile name in profiles/profiles.yml
profile: etl_dbt

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]

target-path: "target"
log-path: "logs"

clean-targets:
  - "target"
  - "logs"

models:
  etl_dbt:
    staging:
      # Staging is lightweight cleaning; keep as views, no landing table
      +materialized: view

seeds:
  etl_dbt:
    test_data:
      # CSV column types declared explicitly (seed otherwise infers from values)
      +column_types:
        qty: integer
        unit_price: double
        order_date: date