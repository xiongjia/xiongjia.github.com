version: 2

# Source DB = data/raw.duckdb (generated by scripts/generate_mock_data.py).
# database: raw matches the attach alias configured in profiles/profiles.yml.
sources:
  - name: raw
    database: raw
    schema: main
    freshness: null
    tables:
      - name: customers
        description: Mock customer master data
      - name: products
        description: Mock product master data
      - name: orders
        description: Mock order headers (one batch per day)
      - name: order_items
        description: Mock order line items (1..n per order)