version: 2

models:
  - name: fct_orders
    description: One row per order with rolled-up item counts and amounts.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: gross_amount
        tests: [not_null]
      - name: net_amount
        tests: [not_null]

  - name: dim_customers
    description: Customer master + lifetime behavior.
    columns:
      - name: customer_id
        tests: [unique, not_null]

  - name: dim_products
    description: Product master + sales stats.
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: units_sold
        tests: [not_null]

  - name: daily_sales
    description: Daily sales rollup — incremental (delete+insert by order_date).
    columns:
      - name: order_date
        tests: [unique, not_null]
      - name: order_count
        tests: [not_null]