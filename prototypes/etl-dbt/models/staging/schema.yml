version: 2

models:
  - name: stg_test_data
    description: Cleaned valid orders (cancelled filtered out)
    columns:
      - name: order_id
        description: Order id
        tests:
          - unique
          - not_null
      - name: qty
        description: Quantity ordered (never NULL; line_total depends on it)
        tests:
          - not_null
      - name: unit_price
        description: Unit price (never NULL; line_total depends on it)
        tests:
          - not_null
      - name: line_total
        description: Line total qty * unit_price (computed in staging)
        tests:
          - not_null