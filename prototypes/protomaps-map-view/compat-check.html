<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MapLibre × pmtiles stack check</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
      }
      #status {
        padding: 10px 14px;
        font:
          13px/1.5 ui-monospace,
          monospace;
        color: #fff;
        background: #64748b;
      }
      #status.ok {
        background: #16a34a;
      }
      #status.err {
        background: #dc2626;
      }
      #map {
        width: 100%;
        height: calc(100% - 44px);
      }
    </style>
  </head>
  <body>
    <div id="status">
      checking… (needs a local tiles file, default .cache/pmtiles/shanghai.pmtiles)
    </div>
    <div id="map"></div>
    <script type="module">
      import { Map, addProtocol } from "maplibre-gl";
      import "maplibre-gl/dist/maplibre-gl.css";
      import { Protocol } from "pmtiles";
      import { layers, namedFlavor } from "@protomaps/basemaps";

      const url =
        new URLSearchParams(location.search).get("url") ?? "pmtiles:///pmtiles/shanghai.pmtiles";
      const status = document.getElementById("status");
      let jsonOk = false;
      let tileRequests = 0;
      let loaded = false;

      const setStatus = (text, ok) => {
        status.textContent = text;
        status.className = ok ? "ok" : "err";
      };

      const protocol = new Protocol();
      const tile = protocol.tile;
      addProtocol("pmtiles", (params, abortController) => {
        console.log("[compat]", params.type, params.url);
        if (params.type === "json") {
          jsonOk = true;
        } else if (params.type === "arrayBuffer") {
          // maplibre v5 asks tile bytes with type "arrayBuffer" (not "tile").
          tileRequests += 1;
          status.textContent = `protocol ok — tile requests so far: ${tileRequests}`;
        }
        return tile(params, abortController);
      });

      const map = new Map({
        container: "map",
        style: {
          version: 8,
          glyphs: "/glyphs/{fontstack}/{range}.pbf",
          sources: {
            protomaps: {
              type: "vector",
              url,
              attribution: "Learning demo · © OpenStreetMap contributors / Protomaps",
            },
          },
          layers: layers("protomaps", namedFlavor("light"), { lang: "zh" }),
        },
        center: [121.47, 31.23],
        zoom: 11,
      });

      map.on("load", () => {
        loaded = true;
        if (jsonOk && tileRequests > 0) {
          setStatus(`STACK OK — TileJSON ok, ${tileRequests} tile requests, map loaded`, true);
        } else {
          setStatus("map loaded but no tile requests — protocol may be broken", false);
        }
      });
      map.on("error", (e) => {
        if (!loaded) {
          setStatus(`ERROR — ${e.error?.message ?? e.error}`, false);
        }
      });
    </script>
  </body>
</html>
