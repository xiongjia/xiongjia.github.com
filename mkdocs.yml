# site settings
site_name: !ENV [SITE_NAME, 'recycle.bin']
site_url: !ENV [SITE_URL, 'https://xiongjia.github.io']
site_author: xiongjia
site_description: Engineering Workspace - Build -> Learn -> Share
repo_name: recycle.bin
repo_url: https://github.com/xiongjia/xiongjia.github.com
copyright: Copyright &copy; 2025 - present <a href="https://github.com/xiongjia/xiongjia.github.com" target="_blank" rel="noopener noreferrer">recycle.bin</a>

extra:
  git_hash: !ENV [GIT_HASH, '']
  
# plugins
plugins:
  - minify: { minify_html: true }
  - search:
  - mermaid2
  - drawio
  - glightbox
  - meta
  - rss:
      rss_feed_enabled: true
      enabled: true
      abstract_chars_count: 160
      abstract_delimiter: <!-- more -->
      feed_description: recycle.bin
      feeds_filenames:
        json_created: feed_json_created.json
        json_updated: feed_json_updated.json
        rss_created: feed_rss_created.xml
        rss_updated: feed_rss_updated.xml      
      match_path: "notes/posts/.*"
      use_git: true
      pretty_print: true
      use_material_social_cards: true
      date_from_meta:
        as_creation: date.created
        as_update: date.updated
        datetime_format: "%Y-%m-%d %H:%M"
        default_time: "22:00"
  - tags:
      listings_map:
        scoped:
          scope: true
  - blog: 
      blog_dir: notes
      blog_toc: true
      pagination_if_single_page: true
      pagination_per_page: 5
      pagination_url_format: "{page}"
      pagination_keep_content: false


# theme setting
theme:
  custom_dir: overrides
  name: material
  nav_style: light
  include_search_page: false
  search_index_only: true
  icon: { repo: fontawesome/brands/github }
  cache:
    path: .cache/mkdocs
  features:
    - header.autohide
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.tooltips
    - content.footnote.tooltips
    - content.tabs.link
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: deep purple
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep purple
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to light mode

# Extensions settings
markdown_extensions:
  - abbr
  - attr_list
  - def_list
  - footnotes
  - admonition
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom

# Page tree
nav:
  - HOME: index.md
  - NOTES:
    - notes/index.md
  - COLLECTION:
    - collection/index.md
    - Database: collection/database.md
    - Monitor: collection/monitor.md
    - Media: collection/media.md
    - Dev Tools: collection/dev-tools.md
    - Frontend: collection/frontend.md
    - Languages: collection/languages.md
  - RESEARCH: research/research.md
  - PROJECTS: side-projects/side-projects.md
