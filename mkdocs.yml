# site settings
site_name: !ENV [SITE_NAME, 'recycle.bin']
site_url: !ENV [SITE_URL, 'https://xiongjia.github.io']
site_author: xiongjia
site_description: Engineering Workspace - Build -> Learn -> Share
repo_name: recycle.bin
repo_url: https://github.com/xiongjia/xiongjia.github.com
copyright: Copyright &copy; 2025 - present <a href="https://github.com/xiongjia/xiongjia.github.com" target="_blank" rel="noopener noreferrer">recycle.bin</a>

extra:
  git_hash: !ENV [GIT_HASH, '']
  cf_analytics:
    enabled: true
    # Token is public by design (client-side beacon) — env override allows
    # rotation without a git commit; fallback keeps local/CI builds working.
    # Value is interpolated unescaped into the data-cf-beacon JSON attribute,
    # so keep it hex ([0-9a-f]{32}); an empty value disables the beacon.
    token: !ENV [CF_ANALYTICS_TOKEN, 'cd22530495334b6097e23e273034f4cd']
  backlinks:
    enabled: true
    include: ["notes/**"]
    exclude: ["notes/posts/**", "moments/**", "notes/_index_content.md"]
    max_backlinks: 20
    graph:
      enabled: true
      depth: 5
      layout: "lr"
      global_layout: "lr"   # main+subgraph LR -> portrait, avoids width-shrink
      max_nodes: 50
      global_page: "notes/link-graph.md"
  # bucket-hosted large assets (R2/S3, git-ignored under docs/assets/bucket/).
  # md keeps local relative links (VSCode preview); the build rewrites paths
  # whose prefix matches `assets/bucket/` to the remote base_url. Switching
  # buckets = change base_url here, md untouched. Env overrides for testing:
  # MKDOCS_BUCKET_ENABLED / MKDOCS_BUCKET_BASE_URL (see `poe server-bucket`).
  # The rclone remote name is local-only (BUCKET_SYNC_REMOTE in .env) — CI
  # only builds, it never syncs.
  bucket:
    enabled: true
    mappings:
      # Running pace/route data (more specific prefix, placed first to ensure it matches first)
      - prefix: assets/bucket/running/
        bucket: web-assets
        remote_prefix: data/metadata/running
        base_url: "https://pub-b2aff5be2d184901860b85a97a002a8c.r2.dev/data/metadata/running"
      # Images (generic, placed after more specific prefixes)
      - prefix: assets/bucket/
        bucket: web-assets
        remote_prefix: data/img   # object prefix inside the bucket
        base_url: "https://pub-b2aff5be2d184901860b85a97a002a8c.r2.dev/data/img"
    # `poe bucket-upload` rename rule (key = remote_prefix + rendered rule).
    # Default was img/{Y}/{m}/{d}_{h}{i}{s}_{filename} (img = image category
    # dir in the bucket); current rule drops the img/ level. {Y} year(4),
    # {m}/{d}/{h}/{i}/{s} month/day/hour/min/sec (2); {filename} = original
    # stem, lowercased, ASCII letters+digits only, spaces → _ (empty →
    # fallback_name); a .webp suffix is appended automatically. tmp_dir stages
    # the converted WebP before upload (git-ignored, default .bucket/).
    # max_size_mb rejects larger source files (default 10). Upload is dry-run
    # by default — pass --confirm to upload; needs a read-write R2 token.
    upload:
      rule: "{Y}/{m}/{d}_{h}{i}{s}_{filename}"
      fallback_name: noname
      tmp_dir: .bucket
      max_size_mb: 10
    # Running pace/route data (data_key used by sync-running-splits for upload; see
    # internal/plans/arch/bot-cronjob.md）
    running:
      data_key: splits.json
  # default WebP quality for `poe optimize-images` (converts PNG/JPG to WebP);
  # CLI --quality overrides this; the script falls back to 90 if both absent
  optimize_images:
    quality: 90
  # local bot task registry for `poe bot` (see internal/bot-auto-pr-design.md).
  # Builtin tasks (weight / health-summary / sync-running / enu) stay in
  # scripts/git_bot.py; entries here add or override template tasks —
  # cmd/commit/body are format strings with {arg} placeholders, extra CLI
  # args are passed through to cmd.
  bot:
    tasks:
      text-moment:
        args: [text...]
        cmd: ["uv", "run", "python", "scripts/create_moment.py", "{text}"]
        commit: '[bot] feat(moment): add text'
        body: "- text moment: {text}"
      create-post:
        args: [title, category]
        cmd: ["uv", "run", "python", "scripts/create_post.py", "{title}", "--category", "{category}"]
        commit: '[bot] feat(post): add {title}'
        body: "- post: {title} ({category})"
      collect:
        args: [text...]
        cmd: ["uv", "run", "python", "scripts/collect.py", "add", "{text}"]
        commit: '[bot] feat(collect): add item'
        body: "- collect: {text}"
      collect-todo:
        args: [text...]
        cmd: ["uv", "run", "python", "scripts/collect.py", "todo", "{text}"]
        commit: '[bot] feat(collect): add todo'
        body: "- todo: {text}"
      collect-idea:
        args: [text...]
        cmd: ["uv", "run", "python", "scripts/collect.py", "idea", "{text}"]
        commit: '[bot] feat(collect): add idea'
        body: "- idea: {text}"
      # smoke-test task: no args, always creates a fresh "hello world" moment
      # (filename embeds the timestamp, so every run has a diff → always a PR).
      # Run via `poe bot run hello --handoff` or the console/cron.
      hello:
        args: []
        cmd: ["uv", "run", "python", "scripts/create_moment.py", "hello world"]
        commit: '[bot] feat(moment): hello world'
        body: "- hello world (smoke test)"
      # cron pilot: upload the Garmin splits/polyline cache to R2 (the sync
      # step runs first in the same spec). --confirm is passed by the cron
      # spec; plain `poe bot run sync-splits` stays a dry-run by default.
      sync-splits:
        args: []
        cmd: ["uv", "run", "python", "scripts/sync_running_splits.py"]
        commit: '[bot] chore(running): upload splits to R2'
        body: "- splits uploaded to R2 (data/metadata/running/splits.json)"
    # scheduled bot runs (see internal/plans/arch/bot-cronjob.md). Each job fires
    # the raw `poe bot run` spec through the handoff flow (worktree → CI gate
    # → draft PR); schedule is a 5-field cron string in the server's local
    # timezone (per-job `timezone` overrides, e.g. Asia/Shanghai). Disable
    # globally with BOT_API_CRON_ENABLED=false. Note: a bad schedule/spec
    # here fails the API server startup (fail-fast, like models.validate_schemas).
    cron:
    # Daily at 00:45: sync Garmin running data + upload splits to R2 → one draft PR
      daily-sync-running:
        schedule: "45 0 * * *"
        spec: "sync-running + sync-splits --confirm"
        handoff: true
    # Every Saturday at 05:00: local pi CLI generates AI health advice → one draft PR
    # (Note: APScheduler DOW numeric 0=Monday…6=Sunday; using text name SAT is safest)
      weekly-health-summary:
        schedule: "0 5 * * SAT"
        spec: "health-summary"
        handoff: true
    # Smoke test: daily at 13:00, post a "hello world" moment → draft PR
    # (Verify cron auto-trigger; each run has a diff so always produces a PR — just close it.
    #   Note: moment filenames use minute-level timestamps; repeated manual triggers within
    #   the same minute write to the same file — cron once-a-day is unaffected, only affects
    #   rapid manual clicks)
      smoke-hello:
        schedule: "0 13 * * *"
        spec: "hello"
        handoff: true
  moment:
    path: moments
    # feed: enabled by default — generates /moments/feed.xml, which the
    # Notes index page (docs/notes/_index_content.md) links to directly;
    # keep that link in sync if this feed config ever changes
    # Structured metadata per moment, keyed by category tag (the first tag
    # with supplied values wins; a tag whose fields are all missing from `meta`
    # falls through to the next). Fields render on the timeline/detail/archive
    # entries; the moment file supplies values in a `meta:` frontmatter block
    # (e.g. `meta: {name: 老上海面馆, rating: 4}`).
    #   key   — frontmatter key inside the moment's `meta:` block
    #   label — display label (Chinese OK)
    #   type  — text (default) | rating (renders 1–5 stars)
    meta_fields:
      food:
        - { key: name, label: 餐馆, type: text }
        - { key: rating, label: 评分, type: rating }
      film:
        - { key: name, label: 影院, type: text }
        - { key: rating, label: 评分, type: rating }
      misc:
        - { key: name, label: 地点, type: text }
    # Rankings page (extra.moment.rankings): archive-style page at
    # /moments/rankings/ grouping rated moments per category (the meta_fields
    # tags that define a `rating` field) and listing them sorted by score.
    # Visits to the same venue (identical meta `name`) merge into one entry
    # scored by average rating, with a ×N visit count. Categories with no
    # rated moments are omitted; optional per-category title/emoji overrides
    # fall back to the tag name and map.tag_emoji.
    rankings:
      enabled: true
      categories:
        food:
          title: 美食榜
        film:
          title: 影院榜
    # Stats page (extra.moment.stats): /moments/stats/ with monthly posting
    # frequency (Mermaid — injected manually because on_post_build pages
    # bypass mermaid2's on_post_page), top-tag bars and per-year activity
    # heatmaps. On by default (needs no external resources); disable with
    # enabled: false.
    stats:
      enabled: true
    # Geo / map feature. Disable entirely with enabled: false (or by removing
    # the map block) — no geo parsing, no badges, no /moments/map/ page.
    # NOTE: the widget/tiles/glyphs are served from the vine R2 bucket, whose
    # CORS allow-list must include the site origin (https://xiongjia.github.io
    # and http://localhost:8000 for dev); changing SITE_URL requires updating
    # the R2 CORS rules first.
    map:
      enabled: true
      # Hashed widget files (vine `build:widget` + `sync-assets --only widget`).
      # A new vine release changes the hash → update these two URLs (or point
      # them at your own CDN copy of the same files).
      widget_js: https://pub-b2aff5be2d184901860b85a97a002a8c.r2.dev/vine/widget/map-widget-885e9d424bea.js
      widget_css: https://pub-b2aff5be2d184901860b85a97a002a8c.r2.dev/vine/widget/map-widget-6d4cf0bf511b.css
      pmtiles_prefix: pmtiles://https://pub-b2aff5be2d184901860b85a97a002a8c.r2.dev/vine/pmtiles/
      glyphs_url: https://pub-b2aff5be2d184901860b85a97a002a8c.r2.dev/vine/glyphs/{fontstack}/{range}.pbf
      # CDN dependencies the widget bundle loads at runtime. They are
      # EXTERNALIZED at vine build time (rollup output.paths bakes these
      # absolute URLs into map-widget-*.js), so the page itself does not load
      # them — this block is documentation/audit. To use a different CDN,
      # rebuild the widget with a different CDN_BASE
      # (vine packages/ui/src/lib/widget-build.ts) and point widget_js at that
      # bundle; versions below must match the bundle it was built with.
      cdn:
        react: https://esm.sh/react@19.2.7
        react-dom/client: https://esm.sh/react-dom@19.2.7/client
        maplibre-gl: https://esm.sh/maplibre-gl@5.24.0
        pmtiles: https://esm.sh/pmtiles@4.4.1
        "@protomaps/basemaps": https://esm.sh/@protomaps/basemaps@5.7.2
      default_region: shanghai
      regions:
        shanghai:
          bbox: [120.8, 30.6, 122.2, 31.8]
          center: [121.5, 31.2]
          zoom: 12
          label: 上海
        tokyo:
          bbox: [139.4, 35.4, 140.2, 35.9]
          center: [139.8, 35.65]
          zoom: 12
          label: 东京
      tag_emoji:
        film: 🎬
        food: 🍽️
      # Marker emoji for the generic 其他 bucket (moments whose tags have no
      # tag_emoji entry). Separate key on purpose: tag_emoji's own ``_other``
      # entry is reserved for a literal "_other" tag and never applies here.
      other_emoji: 📌
      # Map control attribution (bottom corner). Empty = widget default
      # (Protomaps + OpenStreetMap).
      attribution: "© recycle.bin · Protomaps"
      # Hide the bottom-right attribution control on moment maps (default:
      # false = shown). Note OSM/MapLibre attribution is normally required
      # by their terms — disable knowingly.
      hide_attribution: true
      # Clustering & per-region limits for the map page. Repeated coordinates
      # are merged into one marker (×N badge + popup of recent visits); each
      # region renders its most recent `region_limit` moments by default with
      # a "load all" button.
      cluster:
        precision: 0.001    # coords snapped to this many degrees (~100m) for merging
        popup_max: 3        # max tabs in a merged marker popup (tab-switched)
        region_limit: 50    # default moments shown per region (load-all button past this)
        auto_open_latest: false  # auto-open the latest activity's marker popup on load/region switch (default: off)
  comments:
    enabled: true
    # provider: giscus (reserved for future use)
    repo: xiongjia/xiongjia.github.com
    repo_id: MDEwOlJlcG9zaXRvcnkxMjM4MjI0NQ==
    category: General
    category_id: DIC_kwDOALzwJc4DCO5O
    mapping: pathname
    lang: en
    light_theme: light
    dark_theme: dark
  
# docs fragments pulled in via `<!-- include: ... -->` — never built as pages
exclude_docs: |
  notes/health/_summary.md

# extra CSS
extra_css:
  - assets/stylesheets/retire.css
  - assets/stylesheets/weight.css
  - assets/stylesheets/nav.css
  - assets/stylesheets/hr.css
  - assets/stylesheets/tools.css
  - assets/stylesheets/back-link.css
  - assets/stylesheets/fitness.css
  - assets/stylesheets/running.css
extra_javascript:
  - assets/javascripts/retire.js
  - assets/javascripts/fitness.js
  - notes/health/running-route-core.js
  - notes/health/running-route.js
  
# hooks (custom Python modules treated as plugins)
hooks:
  - plugins/mermaid_assets.py
  - plugins/snippet_include.py
  - plugins/draft_filter.py
  - plugins/moment_hook.py
  - plugins/backlinks.py
  - plugins/bucket_url.py

# plugins
plugins:
  - minify:
      minify_html: true
      minify_css: true
      minify_js: true
      css_files:
        - assets/stylesheets/back-link.css
        - assets/stylesheets/hr.css
        - assets/stylesheets/nav.css
        - assets/stylesheets/retire.css
        - assets/stylesheets/tools.css
        - assets/stylesheets/weight.css
        - assets/stylesheets/fitness.css
        - assets/stylesheets/running.css
      js_files:
        - assets/javascripts/retire.js
        - assets/javascripts/fitness.js
  - search:
  - macros:
      module_name: docs/notes/health/macros/health_macros
      render_by_default: false
      force_render_paths: "notes/health/*"
  - mermaid2:
      version: 10.9.0
      javascript: assets/javascripts/mermaid.min.js
  - drawio
  - glightbox
  - meta
  - rss:
      rss_feed_enabled: true
      enabled: true
      abstract_chars_count: 160
      abstract_delimiter: <!-- more -->
      feed_description: recycle.bin
      feeds_filenames:
        json_created: feed_json_created.json
        json_updated: feed_json_updated.json
        rss_created: feed_rss_created.xml
        rss_updated: feed_rss_updated.xml      
      match_path: "notes/posts/posts/.*"
      use_git: true
      pretty_print: true
      use_material_social_cards: true
      date_from_meta:
        as_creation: date.created
        as_update: date.updated
        datetime_format: "%Y-%m-%d %H:%M"
        default_time: "22:00"
  - tags:
      listings_map:
        scoped:
          scope: true
  - blog: 
      blog_dir: notes/posts
      blog_toc: true
      pagination_if_single_page: true
      pagination_per_page: 5
      pagination_url_format: "{page}"
      pagination_keep_content: false

theme:
  custom_dir: overrides
  name: material
  nav_style: light
  include_search_page: false
  search_index_only: true
  icon: { repo: fontawesome/brands/github }
  cache:
    path: .cache/mkdocs
  features:
    - header.autohide
    - navigation.footer
    - navigation.indexes
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.tooltips
    - content.footnote.tooltips
    - content.tabs.link
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: deep purple
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep purple
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to light mode

# Extensions settings
markdown_extensions:
  - abbr
  - attr_list
  - def_list
  - footnotes
  - admonition
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom

# Page tree
nav:
  - Notes:
    - index.md
    - Link Graph: notes/link-graph.md
    - Collection:
      - notes/collection/index.md
      - Database: notes/collection/database.md
      - Storage: notes/collection/storage.md
      - Monitor: notes/collection/monitor.md
      - Media: notes/collection/media.md
      - Dev Tools: notes/collection/dev-tools.md
      - Frontend: notes/collection/frontend.md
      - AI: notes/collection/ai.md
      - Languages: notes/collection/languages.md
      - Study Materials: notes/collection/reading.md
      - Game Dev: notes/collection/game-dev.md
      - Maps: notes/collection/maps.md
      - Emoji: notes/collection/emoji.md
      - Plans: notes/collection/scraps/plans.md
    - Tools:
      - notes/tools/index.md
      - Ramen Timer: notes/tools/ramen-timer.md
      - Med Tracker: notes/tools/med-tracker.md
      - Fitness Counter: notes/tools/fitness.md
      - Coffee Flavor Wheel: notes/tools/coffee-flavor-wheel.md
      - GPS Tracker: notes/tools/gps-tracker.md
    - Research: notes/research/index.md
    - Knowledge: notes/knowledge/index.md
    - Reading: notes/reading/index.md
    - Prototypes: notes/prototypes.md
    - Health Monitor:
      - notes/health/index.md
      - Retirement Countdown: notes/health/retire.md
      - Weight Track: notes/health/weight.md
      - Running Track: notes/health/running.md
    - Posts: notes/posts/index.md
  - Projects: projects/index.md
  - Moments: moments/index.md
  - Discuss: discuss/index.md
