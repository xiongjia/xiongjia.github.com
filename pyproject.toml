[project]
name = "xiongjia.github.com"
version = "0.1.0"
description = "Personal notes & research log"
authors = [{ name = "xiongjia", email = "lexiongjia@gmail.com" }]
dependencies = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.16",
    "mkdocs-material-extensions>=1.3.1",
    "mkdocs-mermaid2-plugin>=1.2.1",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocs-drawio-exporter>=0.10.2",
    "mkdocs-drawio>=1.11.2",
    "mkdocs-rss-plugin>=1.17.3",
    "mkdocs-glightbox>=0.4.0",
    "poethepoet>=0.34.0",
    "ruff>=0.11.0",
    "mdformat>=0.7.0",
    "mdformat-gfm>=1.0.0",
    "mdformat-frontmatter>=2.0.0",
    "pillow>=10.0.0",
    "mkdocs-macros-plugin>=1.5.0",
    "python-frontmatter>=1.3.0",
    "pyperclip>=1.11.0",
]
requires-python = "==3.13.*"
readme = "README.md"
license = { text = "MIT" }

[tool.poe.tasks]
server = { cmd = "mkdocs serve", env = { NO_MKDOCS_2_WARNING = "1", MKDOCS_INCLUDE_DRAFTS = "true" }, help = "Dev server WITH drafts (draft blog posts visible)" }
server-prod = { cmd = "mkdocs serve", env = { NO_MKDOCS_2_WARNING = "1" }, help = "Dev server WITHOUT drafts (mirrors production build)" }
build = "mkdocs build"
build-drafts = { cmd = "mkdocs build", env = { MKDOCS_INCLUDE_DRAFTS = "true" }, help = "Build static site INCLUDING drafts" }
build-selfhost = { cmd = "mkdocs build --site-dir site-selfhost", env = { SITE_NAME = "recycle.bin", SITE_URL = "https://xiongjia.github.io" } }
create-post = { cmd = "python scripts/create_post.py", help = "Create a new blog post (defaults to draft): uv run poe create-post \"Title\" --category bits --time \"yesterday 9am\"" }
format-py = "ruff format ."
format-md = "mdformat AGENTS.md CLAUDE.md README.md docs/ internal/ shared/ tests/ --exclude docs/notes/health/_summary.md"
format = [
    { cmd = "ruff format ." },
    { cmd = "mdformat AGENTS.md CLAUDE.md README.md docs/ internal/ shared/ tests/ --exclude docs/notes/health/_summary.md" },
]
fmt = [
    { cmd = "ruff format ." },
    { cmd = "mdformat AGENTS.md CLAUDE.md README.md docs/ internal/ shared/ tests/ --exclude docs/notes/health/_summary.md" },
]
check-fmt = [
    { cmd = "ruff format --check ." },
    { cmd = "mdformat AGENTS.md CLAUDE.md README.md docs/ internal/ shared/ tests/ --exclude docs/notes/health/_summary.md --check" },
]
lint-py = "ruff check ."
optimize-images = { cmd = "python scripts/optimize_images.py", help = "Convert PNG/JPG/JPEG images in docs/ to WebP and update .md references" }
add-weight-week = { cmd = "python scripts/add_weight_week.py", help = "Add an empty week to health weight data: uv run poe add-weight-week [count]" }
update-health-summary = { cmd = "python scripts/update_health_summary.py", help = "Regenerate the health status summary on the health index page (calls local pi CLI)" }
sync-running = { cmd = "python scripts/sync_running.py", help = "Sync running data from the deployed running_page site into docs/notes/health/data/running.yml" }
md2wechat = { cmd = "python scripts/md2wechat.py", help = "Convert a blog post Markdown to WeChat-compatible HTML: uv run poe md2wechat [path]" }
create-moment = { cmd = "python scripts/create_moment.py", help = "Create a new Moment: uv run poe create-moment 'Content' --time '9am'" }
test = { cmd = "uv run --extra test pytest -q", help = "Run unit tests (pytest, test extras): uv run poe test" }

[project.optional-dependencies]
test = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
# exclude build artifacts and vendored/external content from format + lint
extend-exclude = ["external", "site", "site-selfhost", ".cache", "prototypes"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
