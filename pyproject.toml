[project]
name = "xiongjia.github.com"
version = "0.1.0"
description = "Personal notes & research log"
authors = [{ name = "xiongjia", email = "lexiongjia@gmail.com" }]
dependencies = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.16",
    "mkdocs-material-extensions>=1.3.1",
    "mkdocs-mermaid2-plugin>=1.2.1",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocs-drawio-exporter>=0.10.2",
    "mkdocs-drawio>=1.11.2",
    "mkdocs-rss-plugin>=1.17.3",
    "mkdocs-glightbox>=0.4.0",
    "poethepoet>=0.34.0",
    "ruff>=0.11.0",
    "mdformat>=0.7.0",
]
requires-python = "==3.13.*"
readme = "README.md"
license = { text = "MIT" }

[tool.poe.tasks]
server = { cmd = "mkdocs serve", env = { NO_MKDOCS_2_WARNING = "1" } }
build = "mkdocs build"
build-selfhost = { cmd = "mkdocs build --site-dir site-selfhost", env = { SITE_NAME = "recycle.bin", SITE_URL = "https://xiongjia.github.io" } }
format-py = "ruff format . --exclude 'docs/research/external'"
format-md = "mdformat README.md AGENTS.md CLAUDE.md"
format = [
    { cmd = "ruff format . --exclude 'docs/research/external'" },
    { cmd = "mdformat README.md AGENTS.md CLAUDE.md" },
]
fmt = [
    { cmd = "ruff format . --exclude 'docs/research/external'" },
    { cmd = "mdformat README.md AGENTS.md CLAUDE.md" },
]
lint-py = "ruff check . --exclude 'docs/research/external'"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
