[project]
name = "xiongjia.github.com"
version = "0.1.0"
description = "Personal notes & research log"
authors = [{ name = "xiongjia", email = "lexiongjia@gmail.com" }]
dependencies = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.16",
    "mkdocs-material-extensions>=1.3.1",
    "mkdocs-mermaid2-plugin>=1.2.1",
    "mkdocs-minify-plugin>=0.8.0",
    # minify toolchain — htmlmin2/csscompressor are also used directly by
    # plugins/mkdocs_moment for generated pages and moment.css
    "htmlmin2>=0.1.13",
    "csscompressor>=0.9.5",
    "mkdocs-drawio-exporter>=0.10.2",
    "mkdocs-drawio>=1.11.2",
    "mkdocs-rss-plugin>=1.17.3",
    "mkdocs-glightbox>=0.4.0",
    "poethepoet>=0.34.0",
    "ruff>=0.11.0",
    "mdformat>=0.7.0",
    "mdformat-gfm>=1.0.0",
    "mdformat-frontmatter>=2.0.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "mkdocs-macros-plugin>=1.5.0",
    "python-frontmatter>=1.3.0",
    "pyperclip>=1.11.0",
    "genanki>=0.13.1",
    # API server (bot remote API) + its test stack — kept in base deps so a
    # plain `uv sync` is enough on any machine (no extras to forget, no
    # venv churn between `poe test` and `poe api-server`).
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.0.0",
    "pytest>=9.1.1",
    "httpx>=0.27.0",
    # Telegram Bot (Phase 2) — PTB 20.6+ for download_to_drive on the
    # /moment photo path. Kept in base deps so CI's pytest run imports it.
    "python-telegram-bot>=20.6",
]
requires-python = "==3.13.*"
readme = "README.md"
license = { text = "MIT" }

[tool.poe.tasks]
# Dev servers never emit the CF analytics beacon: empty CF_ANALYTICS_TOKEN
# → mkdocs !ENV resolves it to null → the partial renders nothing. See
# overrides/partials/cf-analytics.html for the client-side loopback guard
# that also covers ad-hoc `mkdocs serve` / local static previews.
server = { cmd = "mkdocs serve --dev-addr 0.0.0.0:8000", env = { NO_MKDOCS_2_WARNING = "1", MKDOCS_INCLUDE_DRAFTS = "true", CF_ANALYTICS_TOKEN = "" }, help = "Dev server WITH drafts, bind 0.0.0.0:8000 (draft blog posts visible)" }
server-prod = { cmd = "mkdocs serve --dev-addr 0.0.0.0:8000", env = { NO_MKDOCS_2_WARNING = "1", CF_ANALYTICS_TOKEN = "" }, help = "Dev server WITHOUT drafts, bind 0.0.0.0:8000 (mirrors production build)" }
server-bucket = { cmd = "mkdocs serve --dev-addr 0.0.0.0:8000", env = { NO_MKDOCS_2_WARNING = "1", MKDOCS_INCLUDE_DRAFTS = "true", MKDOCS_BUCKET_ENABLED = "true", CF_ANALYTICS_TOKEN = "" }, help = "Dev server WITH bucket prefix rewrite, bind 0.0.0.0:8000 (test bucket link replacement)" }
build = "mkdocs build"
build-drafts = { cmd = "mkdocs build", env = { MKDOCS_INCLUDE_DRAFTS = "true" }, help = "Build static site INCLUDING drafts" }
build-selfhost = { cmd = "mkdocs build --site-dir site-selfhost", env = { SITE_NAME = "recycle.bin", SITE_URL = "https://xiongjia.github.io" } }
create-post = { cmd = "python scripts/create_post.py", help = "Create a new blog post (defaults to draft): uv run poe create-post \"Title\" --category bits --time \"yesterday 9am\"" }
format-py = "ruff format ."
format-md = "mdformat AGENTS.md CLAUDE.md README.md docs/ internal/ shared/ tests/ .pi/skills/ --exclude docs/notes/health/_summary.md"
format = [
    { cmd = "ruff format ." },
    { cmd = "mdformat AGENTS.md CLAUDE.md README.md docs/ internal/ shared/ tests/ .pi/skills/ --exclude docs/notes/health/_summary.md" },
]
fmt = [
    { cmd = "ruff format ." },
    { cmd = "mdformat AGENTS.md CLAUDE.md README.md docs/ internal/ shared/ tests/ .pi/skills/ --exclude docs/notes/health/_summary.md" },
]
check-fmt = [
    { cmd = "ruff format --check ." },
    { cmd = "mdformat AGENTS.md CLAUDE.md README.md docs/ internal/ shared/ tests/ .pi/skills/ --exclude docs/notes/health/_summary.md --check" },
]
lint-py = "ruff check ."
optimize-images = { cmd = "python scripts/optimize_images.py", help = "Convert PNG/JPG/JPEG images in docs/ to WebP and update .md references (quality: --quality flag, else mkdocs.yml extra.optimize_images.quality)" }
add-weight-week = { cmd = "python scripts/add_weight_week.py", help = "Add an empty week to health weight data: uv run poe add-weight-week [count]" }
update-weight = { cmd = "python scripts/update_weight.py", help = "Record a daily weight into health data: uv run poe update-weight 82 [date]" }
update-health-summary = { cmd = "python scripts/update_health_summary.py", help = "Regenerate the health status summary on the health index page (calls local pi CLI)" }
sync-running = { cmd = "python scripts/sync_running.py", help = "Sync running data from the deployed running_page site into docs/notes/health/data/running.yml" }
bucket-sync = { cmd = "python scripts/bucket_sync.py", help = "Pull docs/assets/bucket/ from R2/S3 via rclone (incremental; checksum+fast-list by default; read-only; dry-run by default, --confirm to apply; uploads happen in PicList)" }
bucket-upload = { cmd = "python scripts/bucket_upload.py", help = "Upload images to the R2 bucket as WebP with a configured rename rule (dry-run by default; needs a read-write R2 token in .env): uv run poe bucket-upload photo.png --confirm" }
bucket-check = { cmd = "python scripts/bucket_check.py", help = "Cross-check bucket assets vs markdown references: unreferenced local files (cleanup candidates) + md links missing from the bucket (--check-remote checks against R2): uv run poe bucket-check [--check-remote]" }
rclone-config-init = { cmd = "python scripts/rclone_config.py", help = "Non-interactively configure the rclone R2 remote from .env (R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY)" }
bot = { cmd = "python scripts/git_bot.py", help = "Local bot: run tasks in an isolated worktree and publish as a PR (e.g. poe bot \"weight 82\" / --plan morning / list / submit / abort / cleanup)" }
md2wechat = { cmd = "python scripts/md2wechat.py", help = "Convert a blog post Markdown to WeChat-compatible HTML: uv run poe md2wechat [path]" }
create-moment = { cmd = "python scripts/create_moment.py", help = "Create a new Moment: --image auto-WebP+bucket, --tags, --place/--lng/--lat (EXIF GPS auto), --draft, --time" }
enu = { cmd = "python scripts/enu.py", help = "English Scraps: add a scrap (poe enu add 'cumbersome') or export Anki cards (poe enu export)" }
collect-add = { cmd = "python scripts/collect.py add", help = "Collect a resource → inbox (needs AI arch): poe collect-add 'content'" }
collect-todo = { cmd = "python scripts/collect.py todo", help = "Add a TODO → plans.md (no AI): poe collect-todo '看这个视频'" }
collect-idea = { cmd = "python scripts/collect.py idea", help = "Add an idea → plans.md (no AI): poe collect-idea '用 MapLibre 做热力图'" }
test = { cmd = "uv run pytest -q", help = "Run unit tests (pytest): uv run poe test" }
api-server = { cmd = "uv run python scripts/api_server.py", help = "Start remote API (binds 0.0.0.0; BOT_API_HOST/BOT_API_PORT override): uv run poe api-server" }
api-server-prod = { ref = "api-server", help = "Start remote API (prod; alias of api-server): uv run poe api-server-prod" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
# exclude build artifacts and vendored/external content from format + lint
extend-exclude = ["external", "site", "site-selfhost", ".cache", "prototypes"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
